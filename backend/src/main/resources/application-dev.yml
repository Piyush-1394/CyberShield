spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cybershield}
    username: ${SPRING_DATASOURCE_USERNAME:cybershield}
    password: ${SPRING_DATASOURCE_PASSWORD:cybershield}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
