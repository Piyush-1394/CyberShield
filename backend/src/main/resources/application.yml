spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  application:
    name: cybershield-api
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-this-secret-key-32}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  reports-dir: ${APP_REPORTS_DIR:./data/reports}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  mail:
    from: ${APP_MAIL_FROM:noreply@cybershield.local}
  seed: ${APP_SEED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

