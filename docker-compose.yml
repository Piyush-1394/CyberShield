services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cybershield
      POSTGRES_USER: cybershield
      POSTGRES_PASSWORD: cybershield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield -d cybershield"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cybershield
      SPRING_DATASOURCE_USERNAME: cybershield
      SPRING_DATASOURCE_PASSWORD: cybershield
      JWT_SECRET: docker-dev-secret-change-me-please-use-32b+
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      APP_REPORTS_DIR: /data/reports
    volumes:
      - reports:/data/reports
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  reports:
