# ==============================================================================
# CyberShield AI — Render Blueprint Deployment Specification
# ==============================================================================
# Architecture:
#   1. cybershield-db:  Render Managed PostgreSQL Database (Free Tier)
#   2. cybershield-api: Spring Boot 3.3.4 Backend Web Service
#   3. cybershield-web: React 18 / Vite SPA Static Site
# ==============================================================================

databases:
  - name: cybershield-db
    databaseName: cybershield
    user: cybershield
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3.3.4 / Java 21)
  # ----------------------------------------------------------------------------
  - type: web
    name: cybershield-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: ./render-build.sh
    startCommand: ./render-start.sh
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173
      - key: APP_SEED
        value: "true"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 / Vite 5)
  # ----------------------------------------------------------------------------
  - type: web
    name: cybershield-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cybershield-api
          property: host
